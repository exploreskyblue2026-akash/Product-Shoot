<style>
body{margin:0;min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:820px){body{grid-template-columns:minmax(0,1fr)}.hero{min-height:220px}}
[hidden]{display:none!important}
.hero{background:var(--azure);color:var(--on-azure);padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:24px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.hero img{width:96px;height:96px}
.hero h1{font-family:var(--f-display);font-variation-settings:"wdth" 125;font-weight:900;font-size:clamp(34px,5vw,64px);line-height:.92;text-transform:uppercase}
.hero p{max-width:40ch;font-size:15px;margin:12px 0 0}
.form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
form h2{font-size:24px;font-weight:800}
.err{color:var(--bad);font-size:14px;min-height:20px}
</style>

<section class="form">
  <form id="signin">
    <h2>Sign in</h2>
    <div class="field"><label for="email">Work email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <button class="btn primary" type="submit">Sign in</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <form id="accept" hidden>
    <h2>Set your password</h2>
    <p class="hint">You were invited to Skyblue Product Studio. Choose a password of at least 10 characters.</p>
    <div class="field"><label for="npw">New password</label><input id="npw" type="password" autocomplete="new-password" minlength="10" required></div>
    <button class="btn primary" type="submit">Save and continue</button>
    <p class="err" id="err2" role="alert"></p>
  </form>
</section>
<script>
(function(){const $=s=>document.querySelector(s);const tok=new URLSearchParams(location.search).get("invite");
if(tok){$("#signin").hidden=true;$("#accept").hidden=false}
async function post(u,b){const r=await fetch(u,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||"Something went wrong");return j}
$("#signin").addEventListener("submit",async e=>{e.preventDefault();$("#err").textContent="";try{await post("/api/login",{email:$("#email").value,password:$("#pw").value});location.href="/"}catch(x){$("#err").textContent=x.message}});
$("#accept").addEventListener("submit",async e=>{e.preventDefault();$("#err2").textContent="";try{await post("/api/invite/accept",{token:tok,password:$("#npw").value});location.href="/"}catch(x){$("#err2").textContent=x.message}});
})();
</script>
</body>
